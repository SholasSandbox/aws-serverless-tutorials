[project]
name = "handlers"
version = "0.1.0"
description = "Python and AWS serverless tutorial exercises"
requires-python = ">=3.12"

# Runtime dependency — mocked in tests, real in any controlled lab exercise
dependencies = [
    "boto3==1.43.28",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — formatter handles this
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
